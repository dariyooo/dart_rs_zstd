name: ZstdBindings
description: FFI bindings to the bundled libzstd.
output: 'lib/src/bindings.g.dart'
ffi-native:
  asset-id: 'package:dart_zstd/src/bindings.g.dart'
headers:
  entry-points:
    - 'third_party/libzstd/lib/zstd.h'
    - 'third_party/libzstd/lib/zdict.h'
    - 'third_party/libzstd/lib/zstd_errors.h'
  include-directives:
    - 'third_party/libzstd/lib/zstd.h'
    - 'third_party/libzstd/lib/zdict.h'
    - 'third_party/libzstd/lib/zstd_errors.h'
# The advanced and dictionary-builder APIs live behind these guards.
compiler-opts:
  - '-DZSTD_STATIC_LINKING_ONLY=1'
  - '-DZDICT_STATIC_LINKING_ONLY=1'
# Every zstd enum holds small non-negative values, so it is an int on every ABI
# this package targets.
silence-enum-warning: true
comments:
  style: any
  length: full
preamble: |
  // Generated by `dart run ffigen` from third_party/libzstd/lib. Do not edit by hand.
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names
  // ignore_for_file: constant_identifier_names, unused_element, unused_field
